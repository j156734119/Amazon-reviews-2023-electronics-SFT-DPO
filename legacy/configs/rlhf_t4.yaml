extends: full.yaml

project:
  output_dir: outputs/t4-qwen3-0.6b

model:
  base_model: Qwen/Qwen3-0.6B
  min_transformers_version: 5.5.4
  sft_merged_dir: outputs/t4-qwen3-0.6b/models/sft-merged
  max_sequence_length: 512
  lora_r: 8
  lora_alpha: 16
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  sft:
    output_dir: outputs/t4-qwen3-0.6b/models/sft
    per_device_batch_size: 1
    gradient_accumulation_steps: 8
    fp16: true
    bf16: false
  dpo:
    output_dir: outputs/t4-qwen3-0.6b/models/dpo
    per_device_batch_size: 1
    gradient_accumulation_steps: 16
    fp16: true
    bf16: false

rlhf:
  human_calibration_samples: 200
  human_train_fraction: 0.8
  ai_reward_train_pairs: 800
  ai_reward_validation_pairs: 500
  ppo_prompt_count: 256
  sft_merged_dir: outputs/t4-qwen3-0.6b/models/sft-merged
  reward:
    output_dir: outputs/t4-qwen3-0.6b/models/reward
    max_sequence_length: 512
    learning_rate: 0.0001
    epochs: 2
    per_device_batch_size: 2
    gradient_accumulation_steps: 8
    warmup_ratio: 0.05
    logging_steps: 10
    eval_steps: 50
    save_steps: 50
    fp16: true
    bf16: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
  ppo:
    output_dir: outputs/t4-qwen3-0.6b/models/ppo
    auxiliary_model_load_in_4bit: true
    total_episodes: 256
    max_prompt_length: 384
    response_length: 128
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 8
    local_rollout_forward_batch_size: 1
    num_mini_batches: 1
    num_ppo_epochs: 1
    learning_rate: 0.000003
    temperature: 0.7
    kl_coef: 0.05
    cliprange: 0.2
    missing_eos_penalty: 1.0
    logging_steps: 1
    save_steps: 8
    fp16: true
    bf16: false
    max_peak_memory_gb: 15.5
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    lora_target_modules: [q_proj, v_proj]
  grpo:
    output_dir: outputs/t4-qwen3-0.6b/models/grpo
    auxiliary_model_load_in_4bit: true
    prompt_count: 256
    num_generations: 4
    max_prompt_length: 384
    max_completion_length: 128
    learning_rate: 0.000003
    epochs: 1
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    generation_batch_size: 4
    num_iterations: 1
    beta: 0.02
    epsilon: 0.2
    loss_type: dapo
    scale_rewards: group
    temperature: 0.7
    use_vllm: false
    logging_steps: 1
    save_steps: 8
    max_steps: -1
    fp16: true
    bf16: false
    max_peak_memory_gb: 15.5
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    lora_target_modules: [q_proj, v_proj]
    reward_weights:
      reward_model: 1.0
      schema: 1.0
      evidence: 1.5
      length: 0.25

evaluation:
  variants: [base, sft, dpo, ppo, grpo]
  judge_pairs:
    - [base, sft]
    - [sft, dpo]
    - [sft, ppo]
    - [dpo, ppo]
    - [sft, grpo]
    - [dpo, grpo]
    - [ppo, grpo]
