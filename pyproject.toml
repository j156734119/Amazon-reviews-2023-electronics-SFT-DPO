[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-review-alignment"
version = "0.1.0"
description = "Reproducible SFT, DPO, PPO, and GRPO post-training pipeline for grounded review analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fangxing Lin"}]
dependencies = [
  "datasets>=3.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "openai>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.4",
  "bitsandbytes>=0.46.1; platform_system == 'Linux'",
  "packaging>=24",
  "peft>=0.18",
  "torch>=2.4",
  "transformers==5.5.4",
  "trl==1.5.1",
]
eval = [
  "matplotlib>=3.8",
]
dev = [
  "nbformat>=5.10",
  "pytest>=8.2",
  "ruff>=0.9",
]

[project.scripts]
review-align = "amazon_review_alignment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
