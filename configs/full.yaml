project:
  seed: 42
  output_dir: outputs/a100-qwen3.5-2b

data:
  source_url: https://huggingface.co/datasets/McAuley-Lab/Amazon-Reviews-2023/resolve/main/raw/review_categories/Electronics.jsonl
  sample_size: 5000
  max_scanned_reviews: 1000000
  rating_targets:
    "1": 1000
    "2": 1000
    "3": 1000
    "4": 1000
    "5": 1000
  splits:
    train: 3500
    validation: 500
    test: 1000

teacher:
  model: gpt-5.4-mini-2026-03-17
  max_output_tokens: 700
  max_retries: 3
  pilot_size: 100
  max_estimated_cost_usd: 12.0
  input_price_per_million: 0.75
  output_price_per_million: 4.50
  batch_discount: 0.50

model:
  base_model: Qwen/Qwen3.5-2B
  min_transformers_version: 5.5.4
  sft_merged_dir: outputs/a100-qwen3.5-2b/models/sft-merged
  max_sequence_length: 768
  max_new_tokens: 160
  temperature: 0.0
  top_p: 1.0
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - in_proj_qkv
    - in_proj_z
    - out_proj
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  sft:
    output_dir: outputs/a100-qwen3.5-2b/models/sft
    learning_rate: 0.0002
    epochs: 1
    per_device_batch_size: 4
    gradient_accumulation_steps: 4
    warmup_ratio: 0.05
    logging_steps: 10
    eval_steps: 100
    save_steps: 100
    max_steps: -1
    fp16: false
    bf16: true
  dpo:
    output_dir: outputs/a100-qwen3.5-2b/models/dpo
    learning_rate: 0.00005
    epochs: 1
    beta: 0.1
    per_device_batch_size: 2
    gradient_accumulation_steps: 8
    warmup_ratio: 0.05
    logging_steps: 10
    eval_steps: 100
    save_steps: 100
    max_steps: -1
    fp16: false
    bf16: true

evaluation:
  variants: [base, sft, dpo]
  max_test_samples: 500
  bootstrap_samples: 10000
  judge_model: gpt-5.4-mini-2026-03-17
  judge_samples_per_pair: 200
  run_llm_judge: false
  judge_pairs:
    - [base, sft]
    - [sft, dpo]
    - [base, dpo]
