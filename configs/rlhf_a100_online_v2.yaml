extends: rlhf_a100_dpo_v2.yaml

rlhf:
  ppo_prompt_count: 1024
  ppo:
    output_dir: outputs/a100-qwen3.5-2b/models/ppo-v2
    total_episodes: 1024
    learning_rate: 0.000005
    temperature: 0.9
    kl_coef: 0.02
    save_steps: 64
  grpo:
    output_dir: outputs/a100-qwen3.5-2b/models/grpo-v2
    prompt_count: 1024
    learning_rate: 0.000005
    temperature: 0.9
    beta: 0.01
    save_steps: 64
    reward_weights:
      reward_model: 2.0
      schema: 0.25
      evidence: 0.5
      length: 0.1

baselines:
  qwen35_2b_fewshot:
    model_id: Qwen/Qwen3.5-2B
    prompt_mode: few_shot
    load_in_4bit: true
  nlptown_template:
    model_id: nlptown/bert-base-multilingual-uncased-sentiment
  deepseek_v4_pro_fewshot:
    model_id: deepseek-v4-pro
    prompt_mode: few_shot
    base_url: https://api.deepseek.com
    max_retries: 3
    retry_seconds: 1.0

evaluation:
  variants:
    - base
    - sft
    - dpo
    - ppo
    - grpo
    - qwen35_2b_fewshot
    - nlptown_template
    - deepseek_v4_pro_fewshot
  judge_samples_per_pair: 100
  judge_pairs:
    - [base, sft]
    - [base, dpo]
    - [base, ppo]
    - [base, grpo]
    - [sft, dpo]
    - [sft, ppo]
    - [sft, grpo]
    - [dpo, ppo]
    - [dpo, grpo]
    - [ppo, grpo]
    - [sft, qwen35_2b_fewshot]
    - [dpo, qwen35_2b_fewshot]
    - [dpo, deepseek_v4_pro_fewshot]
    - [ppo, deepseek_v4_pro_fewshot]
    - [grpo, deepseek_v4_pro_fewshot]
