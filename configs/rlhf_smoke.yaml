extends: smoke.yaml

rlhf:
  human_calibration_samples: 4
  human_train_fraction: 0.75
  ai_reward_train_pairs: 4
  ai_reward_validation_pairs: 2
  ppo_prompt_count: 4
  sft_merged_dir: outputs/smoke/models/sft-merged
  reward:
    output_dir: outputs/smoke/models/reward
    max_sequence_length: 256
    learning_rate: 0.0001
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 1
    warmup_ratio: 0.0
    logging_steps: 1
    eval_steps: 1
    save_steps: 1
    max_steps: 1
    fp16: true
    bf16: false
    lora_r: 4
    lora_alpha: 8
    lora_dropout: 0.05
    lora_target_modules: [q_proj, v_proj]
  ppo:
    output_dir: outputs/smoke/models/ppo
    auxiliary_model_load_in_4bit: true
    total_episodes: 4
    max_prompt_length: 192
    response_length: 64
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 2
    local_rollout_forward_batch_size: 1
    num_mini_batches: 1
    num_ppo_epochs: 1
    learning_rate: 0.000003
    temperature: 0.7
    kl_coef: 0.05
    cliprange: 0.2
    missing_eos_penalty: 1.0
    logging_steps: 1
    save_steps: 1
    fp16: true
    bf16: false
    max_peak_memory_gb: 15.5
    lora_r: 4
    lora_alpha: 8
    lora_dropout: 0.05
    lora_target_modules: [q_proj, v_proj]
  grpo:
    output_dir: outputs/smoke/models/grpo
    auxiliary_model_load_in_4bit: true
    prompt_count: 4
    num_generations: 2
    max_prompt_length: 192
    max_completion_length: 64
    learning_rate: 0.000003
    epochs: 1
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    generation_batch_size: 2
    num_iterations: 1
    beta: 0.02
    epsilon: 0.2
    loss_type: dapo
    scale_rewards: group
    temperature: 0.7
    use_vllm: false
    logging_steps: 1
    save_steps: 1
    max_steps: 1
    fp16: true
    bf16: false
    max_peak_memory_gb: 15.5
    lora_r: 4
    lora_alpha: 8
    lora_dropout: 0.05
    lora_target_modules: [q_proj, v_proj]
    reward_weights:
      reward_model: 1.0
      schema: 1.0
      evidence: 1.5
      length: 0.25

evaluation:
  variants: [base, sft, dpo, ppo, grpo]
  judge_pairs:
    - [sft, ppo]
    - [dpo, ppo]
    - [sft, grpo]
    - [dpo, grpo]
    - [ppo, grpo]
