extends: smoke.yaml

rlhf:
  human_calibration_samples: 8
  human_train_fraction: 0.75
  ai_reward_train_pairs: 8
  ai_reward_validation_pairs: 4
  ppo_prompt_count: 8
  sft_merged_dir: outputs/smoke/models/sft-merged
  reward:
    output_dir: outputs/smoke/models/reward
    max_sequence_length: 256
    learning_rate: 0.0001
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 1
    warmup_ratio: 0.0
    logging_steps: 1
    eval_steps: 1
    save_steps: 1
    max_steps: 1
    lora_r: 4
    lora_alpha: 8
    lora_dropout: 0.05
    lora_target_modules: [q_proj, v_proj]
  ppo:
    output_dir: outputs/smoke/models/ppo
    total_episodes: 8
    max_prompt_length: 192
    response_length: 64
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 2
    local_rollout_forward_batch_size: 1
    num_mini_batches: 1
    num_ppo_epochs: 1
    learning_rate: 0.000003
    temperature: 0.7
    kl_coef: 0.05
    cliprange: 0.2
    missing_eos_penalty: 1.0
    logging_steps: 1
    save_steps: 1
    fp16: true
    max_peak_memory_gb: 15.5
    lora_r: 4
    lora_alpha: 8
    lora_dropout: 0.05
    lora_target_modules: [q_proj, v_proj]

evaluation:
  variants: [base, sft, dpo, ppo]
  judge_pairs:
    - [sft, ppo]
    - [dpo, ppo]
